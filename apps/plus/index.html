/* Layout: zwei Seiten. "Neues Spiel" (Modus, Spieler, Fraktionen auslosen oder wählen) führt zum Punktezähler mit einer Farbfläche pro Seite */
:root {
  color-scheme: dark;
  --table: #17140f;
  --felt: #221d16;
  --ink: #ede3cf;
  --muted: #a99a7f;
  --brass: #c8a25a;
  --line: #4a3f2f;
  --panel-ink: #fbf5e8;
  --display: "IM Fell English SC", "Palatino Linotype", Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --num: "Cinzel", "Palatino Linotype", Georgia, serif;
  --f-nord: #2f5fa6;
  --f-nilf: #3a3a3e;
  --f-scoia: #5f8a2a;
  --f-mon: #a3241e;
  --f-skel: #5e3a8c;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: radial-gradient(ellipse at 50% 0%, var(--felt), var(--table) 70%) fixed, var(--table);
  color: var(--ink); font-family: var(--body); font-size: 16px; overflow: hidden;
}
button { font-family: inherit; }
button:focus-visible, .chip:focus-within, input:focus-visible, summary:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.app { height: 100%; display: flex; flex-direction: column; }
#view-setup .pad { max-width: 560px; margin: 0 auto; }
.view { flex: 1; min-height: 0; overflow-y: auto; }
.pad {
  padding-block: 18px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px;
}
header { text-align: center; display: grid; gap: 4px; }
.eyebrow { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 8vw, 40px); margin: 0; color: var(--brass); }
h2 { font: 500 12px var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0; }
.field { display: grid; gap: 8px; }
.seg { display: flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1 1 auto; background: none; border: 0; color: var(--muted); font: 500 15px var(--body); padding: 8px 12px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--brass); color: var(--table); }
.rule { margin: 0; font-size: 14px; line-height: 1.45; color: var(--muted); }
.rule b { color: var(--ink); font-weight: 500; }

.rows { display: grid; gap: 10px; }
.prow {
  --c: var(--brass);
  display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center;
  padding: 10px; border-radius: 12px;
  background: linear-gradient(100deg, color-mix(in srgb, var(--c) 38%, var(--table)), color-mix(in srgb, var(--c) 10%, var(--table)) 70%);
  border: 1px solid color-mix(in srgb, var(--c) 50%, var(--line));
}
.thumb { width: 52px; aspect-ratio: 195 / 273; max-width: 100%; border-radius: 4px; display: block; box-shadow: 0 3px 8px rgba(0,0,0,.45); }
.prow.spinning .thumb { animation: flick .09s linear infinite alternate; }
@keyframes flick { from { filter: brightness(.7); transform: scale(.95); } to { filter: none; transform: none; } }
.prow.done .thumb { animation: land .5s cubic-bezier(.2,1.5,.4,1); }
@keyframes land { from { transform: rotateY(90deg); } to { transform: none; } }
.pmain { min-width: 0; display: grid; gap: 6px; }
.pname { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.pname input { flex: 1; min-width: 0; background: transparent; border: 0; border-bottom: 1px dashed color-mix(in srgb, var(--ink) 30%, transparent); color: var(--ink); font: 700 16px var(--body); padding: 2px 0; }
.pname input:focus { outline: none; border-bottom-color: var(--brass); }
.fac { font: 400 14px var(--display); color: var(--ink); opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.picks { display: flex; gap: 6px; flex-wrap: wrap; }
.pick { width: 34px; height: 34px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; background-size: cover; background-position: center; opacity: .55; transition: opacity .15s, transform .15s; box-shadow: 0 0 0 1px rgba(255,255,255,.2); }
.pick[aria-pressed="true"] { opacity: 1; transform: scale(1.08); box-shadow: 0 0 0 2px var(--brass); }
.warn { margin: 0; font-size: 14px; color: #f08a7c; }

.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn-main { font: 400 21px var(--display); color: var(--table); background: var(--brass); border: 0; border-radius: 10px; padding: 11px 26px; cursor: pointer; box-shadow: 0 2px 0 #7d6331; }
.btn-main:active { transform: translateY(1px); box-shadow: none; }
.btn-main:disabled { opacity: .5; cursor: default; }
.btn-ghost { font: 500 15px var(--body); color: var(--brass); background: none; border: 1px solid color-mix(in srgb, var(--brass) 55%, var(--line)); border-radius: 10px; padding: 10px 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn-ghost svg { width: 18px; height: 18px; }
details { border-top: 1px solid var(--line); padding-top: 12px; }
summary { cursor: pointer; font: 500 14px var(--body); color: var(--muted); }
.pool { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { --c: var(--brass); display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 4px; cursor: pointer; font-size: 14px; user-select: none; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.emb { width: 26px; height: 26px; border-radius: 50%; background-size: cover; background-position: center; flex: none; }
.chip:has(input:not(:checked)) { opacity: .4; text-decoration: line-through; }
.chip:has(input:checked) { border-color: color-mix(in srgb, var(--c) 70%, var(--line)); }
.opt { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; color: var(--muted); }
.opt input { accent-color: var(--brass); width: 16px; height: 16px; flex: none; }

/* ---------- Punktezähler ---------- */
.counter { height: 100%; display: flex; flex-direction: column; }
.bar {
  display: flex; align-items: center; gap: 8px;
  padding-block: 12px 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.round { margin-right: auto; display: grid; line-height: 1.1; min-width: 0; }
.round b { font: 400 21px var(--display); color: var(--brass); font-variant-numeric: lining-nums; }
.round span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 40px; height: 40px; padding: 0; justify-content: center; flex: none; }
.bar .btn-main { font-size: 17px; padding: 9px 14px; flex: none; }
.banner {
  margin: 0 max(10px, env(safe-area-inset-left, 0px)) 8px;
  padding: 8px 12px; border-radius: 10px; font-size: 14px; line-height: 1.4; text-align: center;
  background: color-mix(in srgb, var(--brass) 18%, var(--table));
  border: 1px solid color-mix(in srgb, var(--brass) 45%, var(--line));
}
.panels {
  flex: 1; min-height: 0; display: grid; gap: 8px;
  grid-template-columns: repeat(var(--pc, 1), 1fr); grid-auto-rows: 1fr;
  padding-left: max(10px, env(safe-area-inset-left, 0px));
  padding-right: max(10px, env(safe-area-inset-right, 0px));
  padding-bottom: 10px;
}
.panel {
  --c: var(--f-nord); --c2: var(--c);
  position: relative; min-width: 0; min-height: 0; container-type: inline-size;
  border-radius: 16px; overflow: hidden; color: var(--panel-ink);
  background:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.08), transparent 70%),
    linear-gradient(135deg, color-mix(in srgb, var(--c) 92%, black), color-mix(in srgb, var(--c) 60%, black) 48%, color-mix(in srgb, var(--c2) 60%, black) 52%, color-mix(in srgb, var(--c2) 85%, black));
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
  display: grid; grid-template-rows: auto 1fr auto; padding: 10px 12px 12px;
  transition: opacity .3s, filter .3s;
}
.panel.solo { background:
    radial-gradient(circle at 50% 55%, color-mix(in srgb, var(--c) 100%, white 8%), transparent 75%),
    linear-gradient(160deg, color-mix(in srgb, var(--c) 92%, black), color-mix(in srgb, var(--c) 50%, black)); }
.panel.flip { transform: rotate(180deg); }
.panels.table { grid-auto-rows: auto; grid-template-rows: 1fr 1fr; }
.panels.table[data-n="2"] { grid-template-columns: 1fr; grid-template-areas: "p0" "p1"; }
.panels.table[data-n="3"] { grid-template-columns: 1fr 1fr; grid-template-areas: "p1 p1" "p0 p2"; }
.panels.table[data-n="4"] { grid-template-columns: 1fr 1fr; grid-template-areas: "p1 p2" "p0 p3"; }
.panels.table[data-n="5"] { grid-template-columns: repeat(6, 1fr); grid-template-areas: "p1 p1 p1 p2 p2 p2" "p0 p0 p4 p4 p3 p3"; }
.panel.out { opacity: .4; filter: grayscale(.8); }
.panel.won { box-shadow: inset 0 0 0 3px var(--brass); }
.ptop { display: flex; align-items: center; gap: 10px; min-width: 0; }
.syms { display: flex; flex: none; }
.sym { width: 52px; height: 52px; border-radius: 50%; background-size: cover; background-position: center; box-shadow: 0 0 0 2px rgba(255,255,255,.35), 0 3px 10px rgba(0,0,0,.45); }
.syms .sym + .sym { margin-left: -14px; }
.who { min-width: 0; display: grid; }
.who .n { font: 700 15px var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who .f { font: 400 13px var(--display); opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.starter { margin-left: auto; flex: none; font: 700 11px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--table); background: var(--brass); border-radius: 999px; padding: 3px 8px; }
@container (max-width: 230px) {
  .ptop { flex-wrap: wrap; }
  .who { order: 3; flex-basis: 100%; }
  .who .f { display: none; }
  .sym { width: 42px; height: 42px; }
}
.score-row { display: flex; align-items: center; justify-content: center; gap: 4px; min-height: 0; }
.step {
  width: clamp(44px, 13vw, 64px); aspect-ratio: 1; max-width: 100%; border-radius: 50%;
  border: 0; background: rgba(0,0,0,.22); color: var(--panel-ink);
  font: 400 clamp(26px, 8vw, 38px) var(--body); line-height: 1; cursor: pointer; flex: none;
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.step:active { background: rgba(0,0,0,.38); }
.score { flex: 1; min-width: 0; background: none; border: 0; color: inherit; cursor: pointer;
  font: 600 clamp(50px, 17vw, 104px) var(--num); line-height: 1; font-variant-numeric: lining-nums tabular-nums; text-shadow: 0 3px 14px rgba(0,0,0,.35); }
.panels.many .score { font-size: clamp(38px, 12vw, 72px); }
.panels.many .step { width: clamp(38px, 10vw, 52px); font-size: clamp(22px, 6vw, 30px); }
.score-input { width: 3.2ch; text-align: center; background: rgba(0,0,0,.25); border: 0; border-radius: 10px; color: inherit; font: 600 clamp(42px, 14vw, 88px) var(--num); padding: 0; }
.score.bump { animation: bump .18s ease-out; }
@keyframes bump { 50% { transform: scale(1.08); } }
.foot { display: flex; justify-content: center; align-items: center; gap: 12px; min-height: 30px; }
.gem { width: 34px; height: 34px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; transition: filter .25s, opacity .25s, transform .25s; }
.gem img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
.gem.lost { filter: grayscale(1) brightness(.45); opacity: .55; transform: scale(.85); }
.vp { display: flex; align-items: center; gap: 8px; font: 500 13px var(--body); }
.vp .pips { display: flex; gap: 4px; }
.vp i { width: 12px; height: 12px; transform: rotate(45deg); border: 1.5px solid rgba(255,255,255,.6); border-radius: 2px; }
.vp i.on { background: var(--brass); border-color: #f3d79a; box-shadow: 0 0 6px rgba(240,200,110,.7); }
.vp .gain { color: #ffe3a1; font-weight: 700; }
@media (prefers-reduced-motion: reduce) {
  .prow.spinning .thumb, .prow.done .thumb, .score.bump { animation: none; }
}
</style>
</head>
<body>

<div class="app">
  <!-- Seite 1: Neues Spiel -->
  <div class="view" id="view-setup">
    <div class="pad">
      <header>
        <span class="eyebrow">Gwent · Klassisch</span>
        <h1>Neues Spiel</h1>
      </header>

      <div class="field">
        <h2>Spielmodus</h2>
        <div class="seg" role="group" aria-label="Spielmodus">
          <button id="mode-duel" aria-pressed="true">Duell</button>
          <button id="mode-ffa" aria-pressed="false">Alle gegen Alle</button>
        </div>
        <p class="rule" id="rule"></p>
      </div>

      <div class="field" id="count-field" hidden>
        <h2>Spieler</h2>
        <div class="seg" role="group" aria-label="Anzahl Spieler">
          <button id="n3" aria-pressed="true">3</button>
          <button id="n4" aria-pressed="false">4</button>
          <button id="n5" aria-pressed="false">5</button>
        </div>
      </div>

      <div class="field">
        <h2>Fraktionen</h2>
        <p class="rule" id="seat"></p>
        <div id="rows" class="rows"></div>
        <p class="warn" id="warn" hidden></p>
      </div>

      <div class="actions">
        <button class="btn-ghost" id="draw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="16" cy="16" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>Fraktionen auslosen</button>
        <button class="btn-main" id="start">Spiel starten</button>
      </div>
      <div class="actions"><button class="btn-ghost" id="resume" hidden>Zurück zum laufenden Spiel</button></div>

      <details>
        <summary>Einstellungen</summary>
        <div class="pool" id="pool"></div>
        <label class="opt"><input type="checkbox" id="unique" checked> Beim Auslosen jede Fraktion nur einmal vergeben</label>
        <label class="opt" id="opp-wrap"><input type="checkbox" id="opp" checked> Tischansicht: Jedes Feld zeigt zum Platz seines Spielers (Handy oder Tablet liegt in der Tischmitte)</label>
      </details>
    </div>
  </div>

  <!-- Seite 2: Punktezähler -->
  <div class="view" id="view-count" style="overflow:hidden" hidden>
    <div class="counter">
      <div class="bar">
        <div class="round"><b id="round">Runde 1</b><span id="goal"></span></div>
        <button class="btn-ghost icon-btn" id="undo" hidden aria-label="Letztes Rundenende rückgängig" title="Rückgängig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
        <button class="btn-ghost icon-btn" id="to-setup" aria-label="Neues Spiel einrichten" title="Neues Spiel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
        <button class="btn-main" id="end-round">Runde beenden</button>
      </div>
      <div class="banner" id="banner" hidden></div>
      <div class="panels" id="panels"></div>
    </div>
  </div>
</div>

const FACTIONS = [
  { id:'nord',  name:'Königreiche des Nordens', c:'var(--f-nord)' },
  { id:'nilf',  name:'Nilfgaard',               c:'var(--f-nilf)' },
  { id:'scoia', name:"Scoia'tael",              c:'var(--f-scoia)' },
  { id:'mon',   name:'Monster',                 c:'var(--f-mon)' },
  { id:'skel',  name:'Skellige',                c:'var(--f-skel)' },
];
const byId = Object.fromEntries(FACTIONS.map(f=>[f.id,f]));
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
const emb = id => `<span class="emb" style="background-image:url(${EMB[id]})"></span>`;
const SEATS = {
  2: 'Sitzordnung: Spieler 1 sitzt oben, Spieler 2 unten.',
  3: 'Sitzordnung im Uhrzeigersinn: Spieler 1 unten links, Spieler 2 oben, Spieler 3 unten rechts.',
  4: 'Sitzordnung im Uhrzeigersinn: Spieler 1 unten links, 2 oben links, 3 oben rechts, 4 unten rechts.',
  5: 'Sitzordnung im Uhrzeigersinn: Spieler 1 unten links, 2 oben links, 3 oben rechts, 4 unten rechts, 5 unten in der Mitte.'
};
// Tischansicht: oben liegende Plätze werden um 180° gedreht
const TOP_SEATS = { 2:[0], 3:[1], 4:[1,2], 5:[1,2] };
const RULES = {
  duel: '<b>2 Spieler, beste aus 3 Runden.</b> Jeder hat 2 Edelsteine. Wer eine Runde verliert, gibt einen ab. Bei Gleichstand verlieren beide einen, ausser einer spielt Nilfgaard: Nilfgaard gewinnt dann die Runde.',
  ffa:  '<b>3 bis 5 Spieler, keine Rundenbegrenzung.</b> Am Rundenende bekommt jeder 1 Siegpunkt für jeden Gegner, dessen Stärke er übertrifft. Gleichstand zählt nicht, ausser für Nilfgaard (auch mehrere Nilfgaard-Spieler bekommen dann je 1 Punkt). Ziel: Spielerzahl + 1 Siegpunkte (3 → 4, 4 → 5, 5 → 6). Die erste Runde beginnt ein zufälliger Spieler, danach wer in der Vorrunde die meisten Punkte holte.'
};

/* ================= Seite 1: Neues Spiel ================= */
let setup = store.get('g2-setup', null) || { mode:'duel', n:3, rows:[] };
const off = new Set(store.get('g2-off', []));
const unique = $('unique'), opp = $('opp');
unique.checked = store.get('g2-unique', true);
opp.checked = store.get('g2-opp', true);
unique.onchange = ()=>{ store.set('g2-unique', unique.checked); validate(); };
opp.onchange = ()=>{ store.set('g2-opp', opp.checked); renderSetup(); };

if (!['duel','ffa'].includes(setup.mode)) setup.mode = 'duel';
const count = ()=> setup.mode==='duel' ? 2 : setup.n;
const DEFAULTS = ['nord','mon','scoia','nilf','skel'];
function fillRows(){
  const n = count();
  while (setup.rows.length < n) {
    const used = setup.rows.map(r=>r.f);
    setup.rows.push({ f: DEFAULTS.find(x=>!used.includes(x)) || 'nord', name: 'Spieler ' + (setup.rows.length+1) });
  }
  setup.rows.length = n;
}
function rowHTML(r, i){
  const f = byId[r.f];
  return `<div class="prow" id="row${i}" style="--c:${f.c}">
    <img class="thumb" src="${IMG[r.f]}" alt="">
    <div class="pmain">
      <div class="pname"><input type="text" id="name${i}" value="${esc(r.name)}" maxlength="16" aria-label="Name Spieler ${i+1}"></div>
      <span class="fac">${f.name}</span>
      <div class="picks">${FACTIONS.map(x=>`<button class="pick" data-i="${i}" data-f="${x.id}" style="background-image:url(${EMB[x.id]})" aria-label="${x.name}" title="${x.name}" aria-pressed="${r.f===x.id}"></button>`).join('')}</div>
    </div></div>`;
}
function renderSetup(){
  fillRows(); store.set('g2-setup', setup);
  ['duel','ffa'].forEach(m=>$('mode-'+m).setAttribute('aria-pressed', setup.mode===m));
  [3,4,5].forEach(n=>$('n'+n).setAttribute('aria-pressed', setup.n===n));
  $('count-field').hidden = setup.mode!=='ffa';
  $('seat').hidden = !opp.checked;
  $('seat').textContent = SEATS[count()];
  $('rule').innerHTML = RULES[setup.mode];
  $('rows').innerHTML = setup.rows.map(rowHTML).join('');
  $('rows').querySelectorAll('.pick').forEach(b=>b.onclick=()=>{ setup.rows[+b.dataset.i].f = b.dataset.f; renderSetup(); });
  $('rows').querySelectorAll('input[type=text]').forEach((inp,k)=>{
    const i = +inp.id.slice(4);
    inp.oninput = ()=>{ setup.rows[i].name = inp.value; store.set('g2-setup', setup); };
  });
  $('resume').hidden = !match;
  validate();
}
function setRow(i, fid){
  const el = $('row'+i), f = byId[fid];
  el.style.setProperty('--c', f.c);
  el.querySelector('.thumb').src = IMG[fid];
  el.querySelector('.fac').textContent = f.name;
  el.querySelectorAll('.pick').forEach(b=>b.setAttribute('aria-pressed', b.dataset.f===fid));
}
const active = ()=>FACTIONS.filter(f=>!off.has(f.id));
function validate(){
  const n = count(), a = active().length;
  const needDraw = unique.checked ? n : 1;
  $('draw').disabled = a < needDraw;
  let msg = '';
  if (a < needDraw) msg = `Zum Auslosen müssen mindestens ${needDraw} Fraktionen im Topf sein (Einstellungen).`;
  $('warn').hidden = !msg; $('warn').textContent = msg;
  $('start').disabled = false;
}
function drawFactions(){
  const n = count(), a = active().map(f=>f.id);
  if (a.length < (unique.checked ? n : 1)) return null;
  const out = [];
  for (let i=0;i<n;i++){
    const src = unique.checked ? a.filter(x=>!out.includes(x)) : a;
    out.push(src[Math.floor(Math.random()*src.length)]);
  }
  return out;
}
function animateDraw(){
  const result = drawFactions(); if (!result) return;
  const a = active().map(f=>f.id), n = count();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  $('draw').disabled = true; $('start').disabled = true;
  const rows = [...Array(n).keys()].map(i=>$('row'+i));
  rows.forEach(r=>{ r.classList.remove('done'); r.classList.add('spinning'); });
  let t = 0, step = 0; const total = reduce ? 0 : 1300;
  (function tick(){
    if (t >= total){
      result.forEach((f,i)=>{ setup.rows[i].f = f; setRow(i,f); rows[i].classList.remove('spinning'); void rows[i].offsetWidth; rows[i].classList.add('done'); });
      store.set('g2-setup', setup); validate(); return;
    }
    rows.forEach((r,i)=>setRow(i, a[(step + i*2) % a.length]));
    step++; const d = 50 + (t/total)*160; t += d; setTimeout(tick, d);
  })();
}
function renderPool(){
  $('pool').innerHTML = FACTIONS.map(f=>`<label class="chip" style="--c:${f.c}"><input type="checkbox" id="p-${f.id}" ${off.has(f.id)?'':'checked'}>${emb(f.id)}${f.name}</label>`).join('');
  $('pool').querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{
    const id = inp.id.slice(2); inp.checked ? off.delete(id) : off.add(id);
    store.set('g2-off',[...off]); validate();
  }));
}
['duel','ffa'].forEach(m=>$('mode-'+m).onclick=()=>{ setup.mode=m; renderSetup(); });
[3,4,5].forEach(n=>$('n'+n).onclick=()=>{ setup.n=n; renderSetup(); });
$('draw').onclick = animateDraw;
$('start').onclick = ()=>{ startMatch(); show('count'); };
$('resume').onclick = ()=>show('count');

/* ================= Seite 2: Punktezähler ================= */
let match = store.get('g2-match', null);
let undoStack = [];
const target = n => n + 1;

function startMatch(){
  const players = setup.rows.map((r,i)=>({ f:r.f, name:(r.name||'').trim() || 'Spieler '+(i+1) }));
  undoStack = [];
  const sides = players.map(p=>({ name:p.name, members:[p], score:0, gems:2, vp:0, gain:null }));
  match = { mode:setup.mode, round:1, over:false, msg:'', sides, flip:opp.checked, starter:null };
  if (setup.mode==='ffa') {
    match.starter = Math.floor(Math.random()*sides.length);
    match.msg = `Zufällig ausgelost: ${sides[match.starter].name} beginnt die erste Runde.`;
  }
  save(); renderCounter();
}
const save = ()=>store.set('g2-match', match);
const hasNilf = s => s.members.some(m=>m.f==='nilf');

function renderCounter(){
  if (!match) return;
  const S = match.sides, n = S.length, P = $('panels');
  const table = !!match.flip;
  P.style.setProperty('--pc', n<=3 ? 1 : 2);
  P.classList.toggle('many', n>=3);
  P.classList.toggle('table', table);
  P.dataset.n = n;
  P.innerHTML = S.map((s,i)=>{
    const a = byId[s.members[0].f], b = byId[(s.members[1]||s.members[0]).f];
    const flip = table && TOP_SEATS[n].includes(i);
    const span = table ? `grid-area: p${i};` : (n===5 && i===4 ? 'grid-column: span 2;' : '');
    const out = match.mode!=='ffa' && s.gems<=0;
    const won = match.over && match.winner===i;
    const sub = a.name;
    const foot = match.mode==='ffa'
      ? `<div class="vp" aria-label="${s.vp} von ${target(n)} Siegpunkten"><span class="pips">${Array.from({length:target(n)},(_,k)=>`<i class="${k<s.vp?'on':''}"></i>`).join('')}</span>${s.vp}/${target(n)}${s.gain?` <span class="gain">+${s.gain}</span>`:''}</div>`
      : [0,1].map(g=>`<button class="gem${s.gems>g?'':' lost'}" data-i="${i}" data-g="${g}" aria-label="Edelstein ${g+1} von ${esc(s.name)}"><img src="${RUBY}" alt=""></button>`).join('');
    return `<div class="panel solo${flip?' flip':''}${out?' out':''}${won?' won':''}" style="--c:${a.c};--c2:${b.c};${span}">
      <div class="ptop">
        <div class="syms">${s.members.map(m=>`<span class="sym" style="background-image:url(${EMB[m.f]})" role="img" aria-label="${byId[m.f].name}"></span>`).join('')}</div>
        <div class="who"><span class="n">${esc(s.name)}</span><span class="f">${sub}</span></div>
        ${match.mode==='ffa' && match.starter===i && !match.over ? '<span class="starter">beginnt</span>' : ''}
      </div>
      <div class="score-row">
        <button class="step" data-i="${i}" data-d="-1" aria-label="Minus 1, halten für minus 10">−</button>
        <button class="score" id="score${i}" data-i="${i}" aria-label="Stärke von ${esc(s.name)}, antippen zum Eingeben">${s.score}</button>
        <button class="step" data-i="${i}" data-d="1" aria-label="Plus 1, halten für plus 10">+</button>
      </div>
      <div class="foot">${foot}</div>
    </div>`;
  }).join('');
  $('round').textContent = match.over ? 'Spielende' : 'Runde ' + match.round;
  $('goal').textContent = match.mode==='ffa' ? `Ziel: ${target(n)} Siegpunkte` : 'Duell · 2 Edelsteine';
  $('end-round').textContent = match.over ? 'Revanche' : 'Runde beenden';
  $('banner').hidden = !match.msg; $('banner').textContent = match.msg || '';
  $('undo').hidden = undoStack.length===0;
  bindPanels();
}
function change(i, d){
  const s = match.sides[i]; if (match.over || (match.mode!=='ffa' && s.gems<=0)) return;
  s.score = Math.max(0, Math.min(999, s.score + d)); save();
  const el = $('score'+i); el.textContent = s.score;
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
}
function bindPanels(){
  document.querySelectorAll('.step').forEach(b=>{
    let t1, t2, held = false, down = false;
    const i = +b.dataset.i, d = +b.dataset.d;
    const clear = ()=>{ clearTimeout(t1); clearInterval(t2); };
    // Kurz tippen: ±1. Länger halten: ±10, und weitere ±10 solange gehalten.
    b.addEventListener('pointerdown', e=>{
      e.preventDefault(); down = true; held = false;
      t1 = setTimeout(()=>{ held = true; change(i, d*10); if (navigator.vibrate) try{ navigator.vibrate(15); }catch(_){}
        t2 = setInterval(()=>change(i, d*10), 550); }, 450);
    });
    b.addEventListener('pointerup', ()=>{ if (down && !held) change(i,d); down = false; clear(); });
    ['pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev, ()=>{ down = false; clear(); }));
    b.addEventListener('click', e=>{ if (e.detail===0) change(i,d); });
    b.addEventListener('contextmenu', e=>e.preventDefault());
  });
  document.querySelectorAll('.gem').forEach(b=>b.onclick=()=>{
    const s = match.sides[+b.dataset.i], g = +b.dataset.g;
    s.gems = s.gems > g ? g : g+1; save(); renderCounter();
  });
  document.querySelectorAll('.score').forEach(b=>b.onclick=()=>{
    const i = +b.dataset.i, s = match.sides[i]; if (match.over) return;
    const inp = document.createElement('input');
    inp.type='number'; inp.inputMode='numeric'; inp.min='0'; inp.className='score-input'; inp.value=s.score; inp.id='score-edit';
    b.replaceWith(inp); inp.focus(); inp.select();
    const commit = ()=>{ const v = parseInt(inp.value,10); if (!isNaN(v)) s.score = Math.max(0, Math.min(999, v)); save(); renderCounter(); };
    inp.addEventListener('blur', commit, { once:true });
    inp.addEventListener('keydown', e=>{ if (e.key==='Enter') inp.blur(); if (e.key==='Escape') { inp.value = s.score; inp.blur(); } });
  });
}
const pts = n => n===1 ? '1 Punkt' : n + ' Punkten';

function endRoundGems(){
  const [A, B] = match.sides, r = match.round;
  let winner = null;
  if (A.score > B.score) winner = 0;
  else if (B.score > A.score) winner = 1;
  else if (hasNilf(A) !== hasNilf(B)) winner = hasNilf(A) ? 0 : 1;
  if (winner===null) {
    A.gems--; B.gems--;
    match.msg = `Runde ${r}: Gleichstand bei ${A.score}. Beide verlieren einen Edelstein.`;
  } else {
    const w = match.sides[winner], l = match.sides[1-winner];
    l.gems--;
    match.msg = `Runde ${r}: ${w.name} gewinnt` + (w.score===l.score ? ` den Gleichstand dank Nilfgaard.` : ` mit ${pts(w.score)}.`);
  }
  const alive = match.sides.map((s,i)=>s.gems>0?i:-1).filter(i=>i>=0);
  if (alive.length<=1) {
    match.over = true; match.winner = alive.length===1 ? alive[0] : null;
    match.msg = alive.length===1 ? `${match.sides[alive[0]].name} gewinnt das Spiel!` : 'Unentschieden: beide Seiten haben keine Edelsteine mehr.';
  } else match.round++;
}
function endRoundFFA(){
  const S = match.sides, r = match.round, n = S.length;
  S.forEach(s=>s.gain=0);
  for (let i=0;i<n;i++) for (let j=0;j<n;j++) {
    if (i===j) continue;
    const a = S[i], b = S[j];
    if (a.score > b.score || (a.score===b.score && hasNilf(a))) a.gain++;
  }
  S.forEach(s=>s.vp += s.gain);
  const maxGain = Math.max(...S.map(s=>s.gain));
  const top = S.map((s,i)=>s.gain===maxGain?i:-1).filter(i=>i>=0);
  match.starter = top[Math.floor(Math.random()*top.length)];
  const parts = S.filter(s=>s.gain>0).map(s=>`${s.name} +${s.gain}`);
  const nord = S.filter((s,i)=>s.members[0].f==='nord' && S.filter((o,j)=>j!==i && s.score>o.score).length>=2).map(s=>s.name);
  let msg = `Runde ${r}: ` + (parts.length ? parts.join(', ') : 'niemand punktet') + '.';
  if (nord.length) msg += ` Norden: ${nord.join(', ')} zieht 1 Karte.`;
  msg += ` ${S[match.starter].name} beginnt` + (top.length>1 ? ' (ausgelost unter Gleichstand).' : '.');
  const goal = target(n);
  const reached = S.map((s,i)=>s.vp>=goal?i:-1).filter(i=>i>=0);
  if (reached.length) {
    const best = Math.max(...reached.map(i=>S[i].vp));
    const leaders = reached.filter(i=>S[i].vp===best);
    if (leaders.length===1) {
      match.over = true; match.winner = leaders[0];
      msg = `${S[leaders[0]].name} gewinnt mit ${best} Siegpunkten!`;
    } else msg += ` Gleichstand an der Spitze mit ${best}, es geht weiter.`;
  }
  match.msg = msg;
  if (!match.over) match.round++;
}
function endRound(){
  if (match.over) { setup.mode = match.mode; startMatch(); return; }
  undoStack.push(JSON.stringify(match));
  match.mode==='ffa' ? endRoundFFA() : endRoundGems();
  match.sides.forEach(s=>s.score=0);
  save(); renderCounter();
}
$('end-round').onclick = endRound;
$('undo').onclick = ()=>{ if (!undoStack.length) return; match = JSON.parse(undoStack.pop()); save(); renderCounter(); };
$('to-setup').onclick = ()=>show('setup');

/* ================= Navigation ================= */
function show(v){
  $('view-setup').hidden = v!=='setup';
  $('view-count').hidden = v!=='count';
  store.set('g2-view', v);
  if (v==='setup') renderSetup(); else renderCounter();
}
window.appBack = ()=>{ if (!$('view-count').hidden) { show('setup'); return true; } return false; };
renderPool();
show(match && store.get('g2-view','setup')==='count' ? 'count' : 'setup');
</script>

</body>
